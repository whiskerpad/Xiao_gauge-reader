; XIAO ESP32S3 Sense 単体ゲージ読み取りファーム
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
monitor_rts = 0   ; USB直結のESP32-S3でモニタ接続時にリセット状態にしない
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_unflags = -Os          ; 速度優先(極座標CNNの計算を速くする)
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial を USB(CDC) に出力
